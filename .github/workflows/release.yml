name: Release — Charts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/release-please.yml@v1
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json

  publish-released:
    name: Publish released charts
    needs: release
    if: needs.release.outputs.releases-created == 'true'
    permissions:
      actions: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/release-dispatch.yml@v1
    with:
      tags-released: ${{ needs.release.outputs.tags-released }}
      workflow: publish-chart.yml
