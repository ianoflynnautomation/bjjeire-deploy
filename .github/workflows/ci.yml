name: CI — Helm Lint & Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  charts:
    name: Helm
    permissions:
      contents: read
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/helm-chart-quality.yml@v1
    with:
      helm-version: "3.16.4"
      chart-paths: "."
      render-charts: bjj-eire/artifact
      namespace: bjjeire-app
      set-values: |
        bjj-api.api.image.tag=ci
        bjj-frontend.frontend.image.tag=ci
        seeder.enabled=false
      template-args: "--debug"
      schema-locations: |
        default
        https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

  score:
    name: Workload review
    needs: charts
    permissions:
      contents: read
      security-events: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/kubernetes-policy-scan.yml@v1
    with:
      manifests-artifact: ${{ needs.charts.outputs.artifact-name }}
      kube-score: true
      kube-score-enforce: false
      trivy: false
      polaris: false
      hadolint: false
