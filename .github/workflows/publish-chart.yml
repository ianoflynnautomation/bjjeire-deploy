name: Publish chart

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish — e.g. umbrella-v0.1.7, api-v0.1.4, web-v0.1.4, mongodb-v0.1.1'
        required: true
        type: string

concurrency:
  group: publish-chart-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      path: ${{ steps.chart.outputs.path }}
      version: ${{ steps.chart.outputs.version }}
    steps:
      - id: chart
        uses: ianoflynnautomation/bjjeire-ci-templates/actions/parse-release-tag@v1
        with:
          tag: ${{ inputs.tag }}
          mapping: |
            api-v=bjj-eire-api/artifact
            mongodb-v=bjj-eire-mongodb/artifact
            web-v=bjj-eire-web/artifact
            umbrella-v=bjj-eire/artifact

  publish:
    name: Publish ${{ inputs.tag }}
    needs: resolve
    permissions:
      contents: read
      packages: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/helm-publish-oci.yml@v1
    with:
      chart-dir: ${{ needs.resolve.outputs.path }}
      checkout-ref: ${{ inputs.tag }}
      expected-version: ${{ needs.resolve.outputs.version }}
      helm-version: "3.16.4"
