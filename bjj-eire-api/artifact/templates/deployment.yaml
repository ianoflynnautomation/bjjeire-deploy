{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bjj-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bjj-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bjj-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "bjj-api.selectorLabels" . | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- $pullSecrets := .Values.api.imagePullSecrets | default list }}
      {{- if .Values.azure.enabled }}
      {{- $pullSecrets = append $pullSecrets (dict "name" (printf "%s-acr-secret" (include "bjj-api.fullname" .))) }}
      {{- end }}
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bjj-api.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.api.serviceAccount.automount | default true }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: api
        securityContext:
          {{- toYaml .Values.api.securityContext | nindent 10 }}
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.api.service.port }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "bjj-api.fullname" . }}
        env:
        - name: SERVER_PORT
          value: {{ .Values.api.service.port | quote }}
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.mongodbRootPassword.name }}
              key: {{ .Values.secrets.mongodbRootPassword.key }}
        - name: MONGODB_URI
          value: {{ include "bjj-api.mongodb.uriTemplate" . | quote }}
        - name: MONGODB_DATABASE
          value: {{ .Values.mongodb.config.database | quote }}
        {{- if .Values.api.springProfiles }}
        - name: SPRING_PROFILES_ACTIVE
          value: {{ .Values.api.springProfiles | quote }}
        {{- end }}
        {{- if .Values.api.jvmOpts }}
        - name: JAVA_TOOL_OPTIONS
          value: {{ .Values.api.jvmOpts | quote }}
        {{- end }}
        {{- if .Values.api.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.api.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.api.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.api.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.api.startupProbe }}
        startupProbe:
          {{- toYaml .Values.api.startupProbe | nindent 10 }}
        {{- end }}
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if .Values.azure.enabled }}
        - name: secrets-store-vol
          mountPath: /mnt/secrets-store
          readOnly: true
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if .Values.azure.enabled }}
      - name: secrets-store-vol
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ include "bjj-api.fullname" . }}-akv-secrets
      {{- end }}
{{- end }}
