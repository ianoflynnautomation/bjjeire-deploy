nameOverride: "bjj-api"
fullnameOverride: "bjj-api"
namespace: bjjeire-app

api:
  enabled: true
  replicaCount: 1
  image:
    repository: bjj-api
    pullPolicy: IfNotPresent
    tag: "local"

  imagePullSecrets: []

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podAnnotations: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 8080

  springProfiles: ""
  jvmOpts: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0"

  env:
    CORS_ALLOWED_ORIGIN: "https://bjjeire.com"
    RATE_LIMIT_ENABLED: "true"
    RATE_LIMIT_PERMIT_LIMIT: "5"
    RATE_LIMIT_WINDOW_SECONDS: "10"
    RATE_LIMIT_REJECTION_STATUS_CODE: "429"
    READ_ONLY_MODE_ENABLED: "true"
    FEATURE_BJJ_EVENTS: "true"
    FEATURE_GYMS: "true"
    FEATURE_STORES: "true"
    FEATURE_COMPETITIONS: "true"
    ENTRA_ISSUER_URI: "https://login.microsoftonline.com/REPLACE_WITH_YOUR_TENANT_ID/v2.0"
    ENTRA_AUDIENCE: "api://REPLACE_WITH_YOUR_CLIENT_ID"
    DONATION_BITCOIN_ADDRESS: ""

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: http
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: http
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  startupProbe:
    httpGet:
      path: /actuator/health/readiness
      port: http
      scheme: HTTP
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

mongodb:
  config:
    user: admin
    host: bjj-mongodb
    port: 27017
    database: Mongodb

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: api.bjj.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bjj-tls-secret
      hosts:
        - api.bjj.local

secrets:
  mongodbRootPassword:
    enabled: true
    create: false
    name: bjj-mongodb-root-password
    key: mongodb-password
    value: ""

azure:
  enabled: false
  tenantId: ""
  keyVaultName: ""
  acrName: ""
  workloadIdentity:
    enabled: false
    clientId: ""
