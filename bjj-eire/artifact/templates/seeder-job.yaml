{{- if .Values.seeder.enabled }}
{{- $saName := default (printf "%s-seeder" .Release.Name) .Values.seeder.serviceAccount.name }}
{{- if .Values.seeder.serviceAccount.create | default true }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bjjeire-seeder
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: seeder
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": {{ .Values.seeder.hookPolicy }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.seeder.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.seeder.serviceAccount.automount | default false }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-seeder
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bjjeire-seeder
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: seeder
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": {{ .Values.seeder.hookPolicy }}
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.seeder.backoffLimit | default 1 }}
  ttlSecondsAfterFinished: {{ .Values.seeder.ttlSecondsAfterFinished | default 300 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bjjeire-seeder
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: seeder
        {{- with .Values.seeder.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $saName }}
      automountServiceAccountToken: {{ .Values.seeder.serviceAccount.automount | default false }}
      {{- with .Values.seeder.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seeder
          image: "{{ .Values.seeder.image.repository }}:{{ .Values.seeder.image.tag }}"
          imagePullPolicy: {{ .Values.seeder.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          {{- if .Values.seeder.force }}
          args: ["--force"]
          {{- end }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: seeder
            - name: BJJ_ENVIRONMENT
              value: {{ .Values.seeder.environment | default "Production" | quote }}
            - name: SEED_DATASET
              value: {{ .Values.seeder.dataset | default "production" | quote }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.seeder.mongodb.secretName }}
                  key: {{ .Values.seeder.mongodb.secretKey }}
            - name: MONGODB_URI
              value: "mongodb://{{ .Values.seeder.mongodb.user }}:$(MONGO_PASSWORD)@{{ .Values.seeder.mongodb.host }}:{{ .Values.seeder.mongodb.port }}/{{ .Values.seeder.mongodb.database }}?authSource=admin&authMechanism=SCRAM-SHA-256"
            - name: MONGODB_DATABASE
              value: {{ .Values.seeder.mongodb.database | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml (.Values.seeder.resources | default (dict "requests" (dict "cpu" "100m" "memory" "128Mi") "limits" (dict "cpu" "500m" "memory" "256Mi"))) | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
