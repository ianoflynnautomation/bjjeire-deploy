bjj-mongodb:
  mongodb:
    image:
      tag: "8.2"
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 1000m
        memory: 1Gi
    persistence:
      storageClassName: managed-premium
      size: 50Gi
bjj-api:
  api:
    image:
      repository: ghcr.io/ianoflynnautomation/bjjeire-api
      pullPolicy: IfNotPresent
      tag: ""
    replicaCount: 2
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: "/metrics"
      prometheus.io/port: "8080"
    env:
      BJJEIRE_CORS_ALLOWEDORIGINS_0: "https://staging.bjjeire.ie"
      BJJEIRE_CORS_ALLOWEDORIGINS_1: "https://www.staging.bjjeire.ie"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PERMIT_LIMIT: "5"
      RATE_LIMIT_WINDOW_SECONDS: "10"
      RATE_LIMIT_REJECTION_STATUS_CODE: "429"
      READ_ONLY_MODE_ENABLED: "true"
      FEATURE_BJJ_EVENTS: "true"
      FEATURE_GYMS: "true"
      FEATURE_STORES: "true"
      FEATURE_COMPETITIONS: "true"
      DONATION_BITCOIN_ADDRESS: ""
      ENTRA_ISSUER_URI: "https://login.microsoftonline.com/REPLACE_WITH_YOUR_TENANT_ID/v2.0"
      ENTRA_AUDIENCE: "api://REPLACE_WITH_YOUR_CLIENT_ID"
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: api.staging.bjjeire.ie
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: bjj-staging-api-tls
        hosts:
          - api.staging.bjjeire.ie
  azure:
    enabled: true
    workloadIdentity:
      enabled: true
bjj-frontend:
  frontend:
    image:
      repository: ghcr.io/ianoflynnautomation/bjjeire-frontend
      pullPolicy: IfNotPresent
      tag: ""
    replicaCount: 2
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: "/metrics"
      prometheus.io/port: "80"
    env:
      NODE_ENV: production
      PORT: "80"
      SERVICES_API_HTTP_0: "http://bjj-api:8080"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 256Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: staging.bjjeire.ie
        paths:
          - path: /
            pathType: Prefix
      - host: www.staging.bjjeire.ie
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: bjj-staging-frontend-tls
        hosts:
          - staging.bjjeire.ie
          - www.staging.bjjeire.ie
seeder:
  dataset: "test"
  image:
    repository: ghcr.io/ianoflynnautomation/bjjeire-seeder
    pullPolicy: IfNotPresent
    tag: "0.1.6"
